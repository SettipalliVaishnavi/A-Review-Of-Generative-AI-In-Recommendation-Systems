{% extends 'base.html' %}

{% block content %}
<style>
    /* Login Page Specific Styles - Overriding/Extending Base */
    .login-container {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh; /* Leaves space for hero text if needed */
        padding: 2rem;
    }

    .login-card {
        max-width: 480px;
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        padding: 3rem 2.5rem;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .login-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 28px 50px rgba(0, 0, 0, 0.25);
    }

    .login-card h1 {
        text-align: center;
        font-size: 2.2rem;
        font-weight: 700;
        color: #1e3a8a;
        margin-bottom: 2rem;
        letter-spacing: -0.02em;
    }

    .login-form label {
        display: block;
        margin-bottom: 0.6rem;
        font-weight: 600;
        color: #1e3a8a;
        font-size: 1.05rem;
    }

    .login-form input {
        width: 100%;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: #ffffff;
    }

    .login-form input:focus {
        outline: none;
        border-color: #6d28d9;
        box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.2);
    }

    .login-form button {
        width: 100%;
        padding: 1.1rem;
        background: #6d28d9;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 0.5rem;
    }

    .login-form button:hover {
        background: #1e3a8a;
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(109, 40, 217, 0.3);
    }

    .extra-links {
        text-align: center;
        margin-top: 1.5rem;
    }

    .extra-links a {
        color: #6d28d9;
        text-decoration: none;
        font-weight: 500;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }

    .text-danger {
        color: #dc2626;
        text-align: center;
        margin-top: 1rem;
        font-weight: 500;
        padding: 0.75rem;
        background: rgba(220, 38, 38, 0.1);
        border-radius: 8px;
        border: 1px solid rgba(220, 38, 38, 0.3);
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 2rem 1.5rem;
        }

        .login-card h1 {
            font-size: 1.9rem;
        }
    }
</style>

<div class="login-container">
    <div class="login-card">
        <h1>User Login</h1>
        <form method="POST" action="{% url 'UserLoginCheck' %}" class="login-form">
            {% csrf_token %}

            <label for="loginid">Login ID</label>
            <input type="text" name="loginid" id="loginid" required placeholder="Enter your username or email">

            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">

            <button type="submit">Login</button>

            {% if messages %}
            <div class="text-danger">
                {% for message in messages %}
                    {{ message }}<br>
                {% endfor %}
            </div>
            {% endif %}
        </form>

        <div class="extra-links">
            <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
