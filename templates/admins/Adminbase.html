<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - A Review of Generative AI in Recommendation Systems</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: url('https://static.vecteezy.com/system/resources/thumbnails/060/597/892/small_2x/futuristic-technology-background-with-glowing-abstract-neural-network-blue-energy-sphere-and-vibrant-electric-light-trails-data-flow-on-a-purple-gradient-background-with-ui-elements-vector.jpg') fixed center/cover;
            color: #e0e7ff;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            z-index: -1;
        }

        /* Header and Navigation */
        header {
            background: rgba(30, 41, 79, 0.9);
            backdrop-filter: blur(12px);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.75rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .navbar h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: #c4b5fd;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .navbar h1:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .navbar ul li a {
            color: #e0e7ff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            background: rgba(109, 40, 217, 0.25);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            border: 1px solid rgba(167, 139, 250, 0.3);
        }

        .navbar ul li a:hover,
        .navbar ul li a:focus {
            background: #7c3aed;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        .navbar ul li a:focus {
            outline: 3px solid #a78bfa;
            outline-offset: 2px;
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            position: relative;
            z-index: 1;
        }

        /* Form and Output Sections */
        .form-section, .output-section, .table-section {
            background: rgba(30, 41, 79, 0.85);
            backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(124, 58, 237, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-section:hover, .output-section:hover, .table-section:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-section h2, .output-section h2, .table-section h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 1.75rem;
        }

        textarea, select, input[type="file"] {
            width: 100%;
            padding: 1.25rem;
            margin-bottom: 1.75rem;
            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: rgba(15, 23, 42, 0.6);
            color: #e0e7ff;
            transition: all 0.3s ease;
        }

        textarea:focus, select:focus, input[type="file"]:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.25);
            outline: none;
        }

        button {
            background: #7c3aed;
            color: #ffffff;
            padding: 1.25rem 2.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #a78bfa;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.5);
        }

        button:focus {
            outline: 3px solid #c4b5fd;
            outline-offset: 2px;
        }

        /* Table for User Details */
        .table-section table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        .table-section th, .table-section td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
            color: #e0e7ff;
        }

        .table-section th {
            background: rgba(124, 58, 237, 0.15);
            font-weight: 600;
            color: #a78bfa;
        }

        .table-section tr:hover {
            background: rgba(124, 58, 237, 0.1);
        }

        /* Diagram and Code Display */
        .output-section img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1.75rem 0;
            border: 1px solid rgba(167, 139, 250, 0.3);
            transition: transform 0.3s ease;
        }

        .output-section img:hover {
            transform: scale(1.03);
        }

        pre {
            background: rgba(15, 23, 42, 0.7);
            padding: 1.75rem;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            border: 1px solid rgba(124, 58, 237, 0.3);
            overflow-x: auto;
            max-height: 600px;
            line-height: 1.5;
            color: #e0e7ff;
            position: relative;
        }

        pre::before {
            content: "Copy Code";
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(124, 58, 237, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        pre:hover::before {
            background: rgba(167, 139, 250, 0.6);
        }

        .error {
            color: #fca5a5;
            font-weight: 500;
            margin-bottom: 1.75rem;
            padding: 1.25rem;
            background: rgba(127, 29, 29, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(252, 165, 165, 0.4);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 0;
            background: rgba(30, 41, 79, 0.9);
            color: #a78bfa;
            width: 100%;
            margin-top: auto;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        footer p {
            font-size: 1rem;
            font-weight: 400;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .navbar {
                padding: 1.5rem 2rem;
            }

            .navbar h1 {
                font-size: 1.9rem;
            }

            .navbar ul {
                gap: 1.5rem;
            }

            .container {
                padding: 0 1.5rem;
                margin: 2rem auto;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 1rem 1.5rem;
            }

            .navbar ul {
                flex-direction: column;
                gap: 1rem;
                margin-top: 1.5rem;
            }

            .navbar ul li a {
                font-size: 1rem;
                padding: 0.6rem 1rem;
            }

            .form-section, .output-section, .table-section {
                padding: 2rem;
            }

            .table-section table {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .navbar h1 {
                font-size: 1.6rem;
            }

            .navbar ul li a {
                font-size: 0.95rem;
                padding: 0.5rem 0.8rem;
            }

            .form-section h2, .output-section h2, .table-section h2 {
                font-size: 1.7rem;
            }

            button {
                font-size: 1rem;
                padding: 0.8rem 1.5rem;
            }

            .container {
                padding: 0 1rem;
            }

            .table-section table {
                font-size: 0.9rem;
            }
        }
    </style>
    <script>
        // Add copy functionality for code blocks
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'PRE' || e.target.parentElement.tagName === 'PRE') {
                const pre = e.target.tagName === 'PRE' ? e.target : e.target.parentElement;
                const text = pre.innerText.replace('Copy Code', '').trim();
                navigator.clipboard.writeText(text).then(() => {
                    const pseudo = pre.style; // Fallback if ::before not accessible
                    pre.setAttribute('data-copied', 'Copied!');
                    setTimeout(() => {
                        pre.removeAttribute('data-copied');
                    }, 2000);
                });
            }
        });
    </script>
</head>
<body>
    <header>
        <div class="navbar">
            <h1>Admin Dashboard</h1>
            <ul>
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a href="{% url 'RegisterUsersView' %}">User Details</a></li>
                <li><a href="{% url 'base' %}">Logout</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        {% block content %}
        <!-- Child admin pages will inject content here -->
        {% endblock %}
    </div>

    <footer>
        <p>© 2025 A Review of Generative AI in Recommendation Systems. All rights reserved.</p>
    </footer>
</body>
</html>
