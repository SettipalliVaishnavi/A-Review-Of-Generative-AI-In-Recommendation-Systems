{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Review of Generative AI in Recommendation Systems</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9fafb;
            color: #1a202c;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Full-screen Hero with Background */
        .hero {
            background-image: url('https://thumbs.dreamstime.com/b/futuristic-glowing-neural-network-dark-minimal-tech-space-bright-neural-fibers-intertwine-glowing-violet-blue-hues-406750576.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.85), rgba(109, 40, 217, 0.75));
            z-index: 1;
        }

        header {
            position: relative;
            z-index: 2;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo:hover {
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        /* Hamburger Menu */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 30px;
            height: 3px;
            background: #ffffff;
            margin: 4px 0;
            transition: 0.3s;
        }

        /* Content Area */
        .content-wrapper {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1400px;
            margin: 4rem auto;
            padding: 0 2rem;
            flex: 1;
        }

        footer {
            text-align: center;
            padding: 2.5rem 0;
            background: #1e3a8a;
            color: #ffffff;
            z-index: 2;
            position: relative;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .navbar {
                padding: 1.5rem 2rem;
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background: rgba(30, 58, 138, 0.95);
                position: absolute;
                top: 100%;
                left: 0;
                padding: 1rem 0;
                gap: 1rem;
                text-align: center;
            }

            .nav-links.active {
                display: flex;
            }

            .logo {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <header>
            <div class="navbar">
                <a href="{% url 'base' %}" class="logo">GenAI RecSys Review</a>
                <nav>
                    <div class="menu-toggle" id="mobile-menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="nav-links" id="nav-links">
                        <a href="{% url 'base' %}">Home</a>
                        <a href="{% url 'UserLoginCheck' %}">User Login</a>
                        <a href="{% url 'register' %}">Register</a>
                        <a href="{% url 'AdminLoginCheck' %}">Admin</a>
                    </div>
                </nav>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="container">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 A Review of Generative AI in Recommendation Systems. All rights reserved.</p>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');

        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
